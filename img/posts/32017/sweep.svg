<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 430" role="img" aria-label="BLG 一穿四路线：HLE、DK、T1、GEN 四支 LCK 队伍依次被淘汰，决赛让一追三">
  <rect x="0" y="0" width="420" height="430" rx="12" fill="#f6f4ee"/>
  <text x="22" y="34" font-family="system-ui, sans-serif" font-size="16" fill="#5b6b68" letter-spacing="1">LCK 四支队，一支一支数</text>

  <g font-family="system-ui, sans-serif">
    <rect x="22" y="54" width="376" height="64" rx="9" fill="#e8efec" stroke="#9bb2ac" stroke-width="1.5"/>
    <text x="42" y="94" font-size="20" font-weight="700" fill="#2f4240">HLE</text>
    <text x="160" y="92" font-size="13" fill="#5b6b68">瑞士轮生死战</text>
    <text x="376" y="94" font-size="17" font-weight="700" fill="#3d6f69" text-anchor="end">2 : 0</text>

    <rect x="22" y="140" width="376" height="64" rx="9" fill="#e8efec" stroke="#9bb2ac" stroke-width="1.5"/>
    <text x="42" y="180" font-size="20" font-weight="700" fill="#2f4240">DK</text>
    <text x="160" y="178" font-size="13" fill="#5b6b68">八强</text>
    <text x="376" y="180" font-size="17" font-weight="700" fill="#3d6f69" text-anchor="end">3 : 0</text>

    <rect x="22" y="226" width="376" height="64" rx="9" fill="#e8efec" stroke="#9bb2ac" stroke-width="1.5"/>
    <text x="42" y="266" font-size="20" font-weight="700" fill="#2f4240">T1</text>
    <text x="160" y="264" font-size="13" fill="#5b6b68">半决赛</text>
    <text x="376" y="266" font-size="17" font-weight="700" fill="#3d6f69" text-anchor="end">3 : 1</text>

    <rect x="22" y="312" width="376" height="64" rx="9" fill="#dcebe4" stroke="#4f8179" stroke-width="2"/>
    <text x="42" y="352" font-size="20" font-weight="700" fill="#23423e">GEN</text>
    <text x="160" y="350" font-size="13" fill="#4a6a64">决赛</text>
    <text x="376" y="352" font-size="17" font-weight="700" fill="#2f6a60" text-anchor="end">3 : 1</text>
  </g>

  <g stroke="#7d9b94" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M210 118 l0 18 m-5 -6 l5 6 l5 -6"/>
    <path d="M210 204 l0 18 m-5 -6 l5 6 l5 -6"/>
    <path d="M210 290 l0 18 m-5 -6 l5 6 l5 -6"/>
  </g>

  <text x="210" y="402" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#5b6b68">GEN 先下一局，BLG 连扳三局 —— 让一追三</text>
  <text x="210" y="420" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#8a9a97">一穿四是横着来的，让一追三是竖着来的</text>
</svg>
